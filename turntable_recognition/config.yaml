name: Turntable Recognition
version: "0.4.0"
slug: turntable_recognition
description: Recognize turntable music and publish now-playing entities to Home Assistant.
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64
homeassistant_api: true
audio: true
stdin: true
map:
  - type: media
    read_only: true
options:
  provider: audd
  input_mode: mock
  audio_source: auto
  audio_threshold_dbfs: -50
  audio_update_seconds: 1
  playback_start_dbfs: -30
  playback_stop_dbfs: -35
  playback_start_seconds: 2
  playback_stop_seconds: 15
  same_song_retry_seconds: 15
  fallback_check_seconds: 60
  no_match_retry_seconds: 30
  audd_api_token: ""
  test_audio_url: "https://audd.tech/example.mp3"
  media_file: ""
  sample_seconds: 12
  simulated_start_seconds: 0
  entity_prefix: turntable
  max_requests_per_day: 100
  max_requests_per_month: 1000
  mock_artist: Fleetwood Mac
  mock_title: Dreams
  mock_album: Rumours
  mock_year: "1977"
schema:
  provider: list(audd)
  input_mode: list(mock|audio_url|media_file|simulated_usb|usb_meter|usb_auto)
  playback_start_dbfs: int(-100,0)
  playback_stop_dbfs: int(-100,0)
  playback_start_seconds: int(1,30)
  playback_stop_seconds: int(1,120)
  same_song_retry_seconds: int(10,300)
  fallback_check_seconds: int(15,600)
  no_match_retry_seconds: int(15,300)
  audio_source: str
  audio_threshold_dbfs: int(-100,0)
  audio_update_seconds: int(1,10)
  audd_api_token: password
  test_audio_url: str
  media_file: str
  sample_seconds: int(5,12)
  simulated_start_seconds: int(0,86400)
  entity_prefix: match(^[a-z0-9_]+$)
  max_requests_per_day: int(1,10000)
  max_requests_per_month: int(1,100000)
  mock_artist: str
  mock_title: str
  mock_album: str
  mock_year: str
